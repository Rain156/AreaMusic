plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Reuse the Forge acceptance save ID world-723bd584.
            programArguments.addAll '--world', '新的世界'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id},minecraft"
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods."${mod_id}"
        enable()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    embeddedCodecs {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    compileOnly.extendsFrom embeddedCodecs
    clientAdditionalRuntimeClasspath.extendsFrom implementation
    runtimeClasspath.extendsFrom localRuntime
}

configurations.configureEach {
    exclude group: 'junit', module: 'junit'
    // Minecraft already provides org.jcraft:jorbis as the automatic module "jorbis".
    // Bundling the soundlibs repack creates a second module with the same name.
    exclude group: 'com.googlecode.soundlibs', module: 'jorbis'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Unit tests run without Minecraft's runtime libraries, so mirror its JOrbis version here.
    testRuntimeOnly 'org.jcraft:jorbis:0.0.17'

    embeddedCodecs 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    embeddedCodecs 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    embeddedCodecs 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    embeddedCodecs 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    embeddedCodecs 'org.jflac:jflac-codec:1.5.2'
}

def embeddedCodecsDir = layout.buildDirectory.dir('generated/embeddedCodecs')
def syncEmbeddedCodecs = tasks.register('syncEmbeddedCodecs', Sync) {
    into embeddedCodecsDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        configurations.embeddedCodecs.collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/**/module-info.class'
    }
}

sourceSets.main.output.dir([builtBy: syncEmbeddedCodecs], embeddedCodecsDir)

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def bundledAudioProviderEntries = [
        'javazoom/spi/mpeg/sampled/file/MpegAudioFileReader.class',
        'javazoom/spi/mpeg/sampled/convert/MpegFormatConversionProvider.class',
        'javazoom/spi/vorbis/sampled/file/VorbisAudioFileReader.class',
        'javazoom/spi/vorbis/sampled/convert/VorbisFormatConversionProvider.class',
        'org/jflac/sound/spi/FlacAudioFileReader.class',
        'org/jflac/sound/spi/FlacFormatConversionProvider.class'
]

def verifyBundledAudioCodecs = tasks.register('verifyBundledAudioCodecs') {
    dependsOn syncEmbeddedCodecs
    inputs.dir embeddedCodecsDir

    doLast {
        File codecRoot = embeddedCodecsDir.get().asFile
        List<String> missingEntries = bundledAudioProviderEntries.findAll {
            !new File(codecRoot, it).isFile()
        }
        boolean bundlesJorbis = new File(codecRoot, 'com/jcraft/jorbis').exists()
        Set<File> nestedJars = fileTree(codecRoot) { include '**/*.jar' }.files
        if (!missingEntries.isEmpty() || bundlesJorbis || !nestedJars.isEmpty()) {
            throw new GradleException(
                    "Bundled audio codec verification failed for ${codecRoot}. " +
                            "Missing provider classes: ${missingEntries}; " +
                            "bundles JOrbis: ${bundlesJorbis}; nested JARs: ${nestedJars}"
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyBundledAudioCodecs
}
