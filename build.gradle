plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Reuse the Forge acceptance save ID world-723bd584.
            programArguments.addAll '--world', '新的世界'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id},minecraft"
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods."${mod_id}"
        enable()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    clientAdditionalRuntimeClasspath.extendsFrom implementation
    runtimeClasspath.extendsFrom localRuntime
}

configurations.configureEach {
    exclude group: 'junit', module: 'junit'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    jarJar(implementation('com.googlecode.soundlibs:mp3spi:1.9.5.4')) {
        version {
            strictly '[1.9.5.4,1.9.5.5)'
            prefer '1.9.5.4'
        }
    }
    jarJar(implementation('com.googlecode.soundlibs:jlayer:1.0.1.4')) {
        version {
            strictly '[1.0.1.4,1.0.1.5)'
            prefer '1.0.1.4'
        }
    }
    jarJar(implementation('com.googlecode.soundlibs:vorbisspi:1.0.3.3')) {
        version {
            strictly '[1.0.3.3,1.0.3.4)'
            prefer '1.0.3.3'
        }
    }
    jarJar(implementation('com.googlecode.soundlibs:jorbis:0.0.17.4')) {
        version {
            strictly '[0.0.17.4,0.0.17.5)'
            prefer '0.0.17.4'
        }
    }
    jarJar(implementation('com.googlecode.soundlibs:tritonus-share:0.3.7.4')) {
        version {
            strictly '[0.3.7.4,0.3.7.5)'
            prefer '0.3.7.4'
        }
    }
    jarJar(implementation('org.jflac:jflac-codec:1.5.2')) {
        version {
            strictly '[1.5.2,1.5.3)'
            prefer '1.5.2'
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def clientAudioRuntimeArtifacts = [
        'mp3spi-1.9.5.4.jar',
        'jlayer-1.0.1.4.jar',
        'vorbisspi-1.0.3.3.jar',
        'jorbis-0.0.17.4.jar',
        'tritonus-share-0.3.7.4.jar',
        'jflac-codec-1.5.2.jar'
]
def clientAudioProviderClasses = [
        'javazoom.spi.mpeg.sampled.file.MpegAudioFileReader',
        'javazoom.spi.mpeg.sampled.convert.MpegFormatConversionProvider',
        'javazoom.spi.vorbis.sampled.file.VorbisAudioFileReader',
        'javazoom.spi.vorbis.sampled.convert.VorbisFormatConversionProvider',
        'org.jflac.sound.spi.FlacAudioFileReader',
        'org.jflac.sound.spi.FlacFormatConversionProvider'
]

def verifyClientRuntimeAudioProviders = tasks.register('verifyClientRuntimeAudioProviders') {
    dependsOn tasks.named('writeClientLegacyClasspath')
    def legacyClasspath = layout.buildDirectory.file('moddev/clientLegacyClasspath.txt')
    inputs.file(legacyClasspath)

    doLast {
        File classpathFile = legacyClasspath.get().asFile
        List<File> classpathEntries = classpathFile.readLines('UTF-8')
                .findAll { !it.isBlank() }
                .collect { file(it) }
        List<String> missingArtifacts = clientAudioRuntimeArtifacts.findAll { artifact ->
            classpathEntries.count { it.name == artifact } != 1
        }
        List<String> failures = []
        URLClassLoader loader = new URLClassLoader(
                classpathEntries.collect { it.toURI().toURL() } as URL[],
                ClassLoader.getPlatformClassLoader()
        )
        try {
            clientAudioProviderClasses.each { className ->
                try {
                    Class.forName(className, true, loader).getDeclaredConstructor().newInstance()
                } catch (Throwable throwable) {
                    failures.add("${className}: ${throwable.class.name}: ${throwable.message}")
                }
            }
        } finally {
            loader.close()
        }

        if (!missingArtifacts.isEmpty() || !failures.isEmpty()) {
            throw new GradleException(
                    "Client audio runtime verification failed for ${classpathFile}. " +
                            "Missing or duplicate artifacts: ${missingArtifacts}; " +
                            "provider failures: ${failures}"
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyClientRuntimeAudioProviders
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'all'
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
}
