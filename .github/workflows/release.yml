name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must equal v<mod_version>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      mod_version: ${{ steps.release.outputs.mod_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$MANUAL_TAG"
          else
            release_tag="$PUSH_TAG"
          fi
          mod_version="$(awk -F= '$1 == "mod_version" { sub(/\r$/, "", $2); print $2 }' gradle.properties)"
          if [[ -z "$mod_version" ]]; then
            echo "mod_version is missing from gradle.properties" >&2
            exit 1
          fi
          expected_tag="v${mod_version}"
          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag '$release_tag' must equal '$expected_tag'" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test build logic with JDK 17
        run: ./gradlew -p buildSrc test --rerun-tasks --no-build-cache --no-daemon

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build all supported targets
        run: ./gradlew test check assemble build --rerun-tasks --no-build-cache --no-daemon --continue

      - name: Collect installable JARs and checksums
        env:
          MOD_VERSION: ${{ steps.release.outputs.mod_version }}
        run: |
          set -euo pipefail
          jars=(
            "platforms/1.20.1/fabric/build/libs/areamusic-fabric-1.20.1-${MOD_VERSION}.jar"
            "platforms/1.20.1/forge/build/libs/areamusic-forge-1.20.1-${MOD_VERSION}.jar"
            "platforms/1.21.1/fabric/build/libs/areamusic-fabric-1.21.1-${MOD_VERSION}.jar"
            "platforms/1.21.1/forge/build/libs/areamusic-forge-1.21.1-${MOD_VERSION}.jar"
            "platforms/1.21.1/neoforge/build/libs/areamusic-neoforge-1.21.1-${MOD_VERSION}.jar"
          )
          rm -rf dist
          mkdir dist
          for jar in "${jars[@]}"; do
            if [[ ! -f "$jar" ]]; then
              echo "Expected installable JAR is missing: $jar" >&2
              exit 1
            fi
            cp "$jar" dist/
          done
          if [[ "$(find dist -maxdepth 1 -type f -name '*.jar' | wc -l)" -ne 5 ]]; then
            echo "Expected exactly five installable JARs" >&2
            exit 1
          fi
          (cd dist && sha256sum ./*.jar | sort -k2 > SHA256SUMS)

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: areamusic-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: areamusic-${{ needs.build.outputs.tag }}
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
