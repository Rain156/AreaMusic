import datura.gradle.VerifyClassBoundaries
import datura.gradle.VerifyFabricProductionJar
import datura.gradle.VerifySourceBoundaries
import datura.gradle.ProductionRootsJvmArgumentProvider
import net.fabricmc.loom.task.RemapJarTask
import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'fabric-loom' version "${mc1_21_1_loom_version}"
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${mod_id}-fabric-${mc1_21_1_minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

configurations {
    embeddedCodecs {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    compileOnly.extendsFrom embeddedCodecs
}

def sharedAudioCodecResources = rootProject.layout.projectDirectory.dir('platforms/shared/audio-codecs')
sourceSets.main.resources.srcDir(sharedAudioCodecResources)

evaluationDependsOn(':core')
evaluationDependsOn(':platforms:mc1_21_1:common')
def coreSourceSets = project(':core').sourceSets
def commonSourceSets = project(':platforms:mc1_21_1:common').sourceSets
def coreMainJava21ClassesDir = layout.buildDirectory.dir('classes/java/coreMainJava21')
def compileCoreMainJava21 = tasks.register('compileCoreMainJava21', JavaCompile) {
    source(coreSourceSets.main.allJava)
    classpath = coreSourceSets.main.compileClasspath
    destinationDirectory.set(coreMainJava21ClassesDir)
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    options.encoding = 'UTF-8'
    options.release = 21
}
def coreMainOutput = files(coreMainJava21ClassesDir).builtBy(compileCoreMainJava21)
def coreTestOutput = coreSourceSets.test.output
def commonMainOutput = commonSourceSets.main.output
def commonTestOutput = commonSourceSets.test.output
def fabricMainOutput = sourceSets.main.output
def fabricTestOutput = sourceSets.test.output
def dedicatedServerProductionRoots = files(
        coreMainOutput,
        commonMainOutput.classesDirs,
        fabricMainOutput.classesDirs
)

def forbiddenFabricPlatformImports = [
        'net.minecraftforge',
        'net.neoforged',
        'dev.architectury',
        'architectury'
]
def forbiddenFabricPlatformInternalNames = [
        'net/minecraftforge',
        'net/neoforged',
        'dev/architectury',
        'architectury'
]

def verifySourceBoundaries = tasks.register('verifySourceBoundaries', VerifySourceBoundaries) {
    sourceFiles.from(sourceSets.main.allJava)
    sourceRoot.set(layout.projectDirectory.dir('src/main/java'))
    boundaryName.set('Fabric 1.21.1')
    forbiddenImportPrefixes.set(forbiddenFabricPlatformImports)
    sourceLanguageVersion.set(java.toolchain.languageVersion.map { it.asInt() })
}

def verifyClassBoundaries = tasks.register('verifyClassBoundaries', VerifyClassBoundaries) {
    classRoots.from(sourceSets.main.output.classesDirs)
    boundaryName.set('Fabric 1.21.1')
    forbiddenInternalNamePrefixes.set(forbiddenFabricPlatformInternalNames)
    dependsOn tasks.named('classes')
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc1_21_1_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${mc1_21_1_fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mc1_21_1_fabric_api_version}"

    implementation(project(':core')) {
        transitive = false
    }
    implementation(project(':platforms:mc1_21_1:common')) {
        transitive = false
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.jcraft:jorbis:0.0.17'

    embeddedCodecs 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    embeddedCodecs 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    embeddedCodecs 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    embeddedCodecs 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    embeddedCodecs 'org.jflac:jflac-codec:1.5.2'
}

def embeddedCodecsDir = layout.buildDirectory.dir('generated/embeddedCodecs')
def syncEmbeddedCodecs = tasks.register('syncEmbeddedCodecs', Sync) {
    into embeddedCodecsDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        configurations.embeddedCodecs.collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/**/module-info.class'
    }
}

sourceSets.main.output.dir([builtBy: syncEmbeddedCodecs], embeddedCodecsDir)

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mc1_21_1_minecraft_version: mc1_21_1_minecraft_version,
            mc1_21_1_fabric_loader_version: mc1_21_1_fabric_loader_version,
            mc1_21_1_fabric_api_version: mc1_21_1_fabric_api_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    dependsOn ':core:classes', ':platforms:mc1_21_1:common:classes'
    from coreMainOutput
    from commonMainOutput

    manifest {
        attributes([
                'Specification-Title'       : mod_id,
                'Specification-Vendor'      : mod_authors,
                'Specification-Version'     : '1',
                'Implementation-Title'      : rootProject.name,
                'Implementation-Version'    : archiveVersion,
                'Implementation-Vendor'     : mod_authors
        ])
    }
}

def remapJarTask = tasks.named('remapJar', RemapJarTask)

def bundledAudioProviderEntries = [
        'javazoom/spi/mpeg/sampled/file/MpegAudioFileReader.class',
        'javazoom/spi/mpeg/sampled/convert/MpegFormatConversionProvider.class',
        'javazoom/spi/vorbis/sampled/file/VorbisAudioFileReader.class',
        'javazoom/spi/vorbis/sampled/convert/VorbisFormatConversionProvider.class',
        'org/jflac/sound/spi/FlacAudioFileReader.class',
        'org/jflac/sound/spi/FlacFormatConversionProvider.class'
]

def verifyProductionJar = tasks.register('verifyProductionJar', VerifyFabricProductionJar) {
    productionJar.set(remapJarTask.flatMap { it.archiveFile })
    codecDirectory.set(embeddedCodecsDir)
    coreMainClassRoots.from(coreMainOutput)
    commonMainClassRoots.from(commonMainOutput.classesDirs)
    fabricMainClassRoots.from(fabricMainOutput.classesDirs)
    testOutputRoots.from(coreTestOutput, commonTestOutput, fabricTestOutput)
    coreTestOutputRoots.from(coreTestOutput)
    commonTestOutputRoots.from(commonTestOutput)
    fabricTestOutputRoots.from(fabricTestOutput)
    serviceSourceFiles.from(
            sharedAudioCodecResources.file('META-INF/services/javax.sound.sampled.spi.AudioFileReader'),
            sharedAudioCodecResources.file('META-INF/services/javax.sound.sampled.spi.FormatConversionProvider')
    )

    expectedFileName.set("${mod_id}-fabric-${mc1_21_1_minecraft_version}-${mod_version}.jar")
    expectedModId.set(mod_id)
    expectedModVersion.set(mod_version)
    expectedModName.set(mod_name)
    expectedModDescription.set(mod_description)
    expectedModLicense.set(mod_license)
    expectedModAuthors.set(mod_authors)
    expectedMinecraftVersion.set(mc1_21_1_minecraft_version)
    expectedLoaderVersion.set(mc1_21_1_fabric_loader_version)
    expectedFabricApiVersion.set(mc1_21_1_fabric_api_version)
    expectedJavaVersion.set(21)
    expectedMainEntrypoint.set('datura.areamusic.fabric.AreaMusicFabric')
    expectedClientEntrypoint.set('datura.areamusic.fabric.client.FabricClientAreaMusic')
    expectedImplementationTitle.set(rootProject.name)
    expectedPackFormat.set(34)
    expectedProjectClassMajor.set(65)
    requiredProviderEntries.set(bundledAudioProviderEntries)
    requiredResourceEntries.set([
            'META-INF/MANIFEST.MF',
            'fabric.mod.json',
            'pack.mcmeta',
            'assets/areamusic/lang/en_us.json',
            'assets/areamusic/lang/zh_cn.json',
            'META-INF/AREA_MUSIC_THIRD_PARTY_NOTICES.txt',
            'META-INF/licenses/LGPL-2.1.txt',
            'META-INF/services/javax.sound.sampled.spi.AudioFileReader',
            'META-INF/services/javax.sound.sampled.spi.FormatConversionProvider'
    ])
    remappingEvidenceEntry.set('datura/areamusic/client/ClientAreaMusic$MinecraftClientRuntime.class')
    expectedIntermediaryName.set('method_1551')
    forbiddenMojangName.set('getInstance')

    dependsOn remapJarTask
    dependsOn syncEmbeddedCodecs
    dependsOn compileCoreMainJava21
    dependsOn ':core:classes', ':core:testClasses'
    dependsOn ':platforms:mc1_21_1:common:classes', ':platforms:mc1_21_1:common:testClasses'
    dependsOn tasks.named('classes'), tasks.named('testClasses')
}

tasks.named('check') {
    dependsOn verifySourceBoundaries, verifyClassBoundaries, verifyProductionJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    inputs.files(dedicatedServerProductionRoots)
            .withPropertyName('dedicatedServerProductionClassRoots')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    dependsOn compileCoreMainJava21
    dependsOn ':platforms:mc1_21_1:common:classes'
    dependsOn tasks.named('classes')

    def productionRootsArgumentProvider = objects.newInstance(
            ProductionRootsJvmArgumentProvider
    )
    productionRootsArgumentProvider.propertyName.set(
            'areamusic.fabric.dedicatedServerProductionRoots'
    )
    productionRootsArgumentProvider.productionRoots.from(
            dedicatedServerProductionRoots
    )
    jvmArgumentProviders.add(productionRootsArgumentProvider)
}
