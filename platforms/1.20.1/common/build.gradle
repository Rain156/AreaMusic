import datura.gradle.VerifyClassBoundaries
import datura.gradle.VerifySourceBoundaries

plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.142'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    mcpVersion = minecraft_version
    addModdingDependenciesTo sourceSets.test
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(project(':core')) {
        transitive = false
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def forbiddenLoaderImports = [
        'net.minecraftforge',
        'net.neoforged',
        'net.fabricmc',
        'org.quiltmc',
        'dev.architectury',
        'architectury'
]

def verifySourceBoundaries = tasks.register('verifySourceBoundaries', VerifySourceBoundaries) {
    sourceFiles.from(sourceSets.main.allJava)
    sourceRoot.set(layout.projectDirectory.dir('src/main/java'))
    boundaryName.set('common')
    forbiddenImportPrefixes.set(forbiddenLoaderImports)
    sourceLanguageVersion.set(java.toolchain.languageVersion.map { it.asInt() })
}

def verifyClassBoundaries = tasks.register('verifyClassBoundaries', VerifyClassBoundaries) {
    classRoots.from(sourceSets.main.output.classesDirs)
    boundaryName.set('common')
    forbiddenInternalNamePrefixes.set([
            'net/minecraftforge',
            'net/neoforged',
            'net/fabricmc',
            'org/quiltmc',
            'dev/architectury',
            'architectury'
    ])
    dependsOn tasks.named('classes')
}

tasks.named('check') {
    dependsOn verifySourceBoundaries, verifyClassBoundaries
}
