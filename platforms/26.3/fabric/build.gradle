import datura.gradle.VerifyClassBoundaries
import datura.gradle.VerifySourceBoundaries
import datura.gradle.ProductionRootsJvmArgumentProvider
import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'net.fabricmc.fabric-loom' version "${mc26_3_loom_version}"
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${mod_id}-fabric-${mc26_3_minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

configurations {
    embeddedCodecs {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    compileOnly.extendsFrom embeddedCodecs
}

def sharedAudioCodecResources = rootProject.layout.projectDirectory.dir('platforms/shared/audio-codecs')
sourceSets.main.resources.srcDir(sharedAudioCodecResources)

evaluationDependsOn(':core')
evaluationDependsOn(':platforms:mc26_3:common')
def coreSourceSets = project(':core').sourceSets
def commonSourceSets = project(':platforms:mc26_3:common').sourceSets
def coreMainJava25ClassesDir = layout.buildDirectory.dir('classes/java/coreMainJava25')
def compileCoreMainJava25 = tasks.register('compileCoreMainJava25', JavaCompile) {
    source(coreSourceSets.main.allJava)
    classpath = coreSourceSets.main.compileClasspath
    destinationDirectory.set(coreMainJava25ClassesDir)
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    options.encoding = 'UTF-8'
    options.release = 25
}
def coreMainOutput = files(coreMainJava25ClassesDir).builtBy(compileCoreMainJava25)
def coreTestOutput = coreSourceSets.test.output
def commonMainOutput = commonSourceSets.main.output
def commonTestOutput = commonSourceSets.test.output
def fabricMainOutput = sourceSets.main.output
def fabricTestOutput = sourceSets.test.output
def dedicatedServerProductionRoots = files(
        coreMainOutput,
        commonMainOutput.classesDirs,
        fabricMainOutput.classesDirs
)

def forbiddenFabricPlatformImports = [
        'net.minecraftforge',
        'net.neoforged',
        'dev.architectury',
        'architectury'
]
def forbiddenFabricPlatformInternalNames = [
        'net/minecraftforge',
        'net/neoforged',
        'dev/architectury',
        'architectury'
]

def verifySourceBoundaries = tasks.register('verifySourceBoundaries', VerifySourceBoundaries) {
    sourceFiles.from(sourceSets.main.allJava)
    sourceRoot.set(layout.projectDirectory.dir('src/main/java'))
    boundaryName.set('Fabric 26.3')
    forbiddenImportPrefixes.set(forbiddenFabricPlatformImports)
    sourceLanguageVersion.set(java.toolchain.languageVersion.map { it.asInt() })
}

def verifyClassBoundaries = tasks.register('verifyClassBoundaries', VerifyClassBoundaries) {
    classRoots.from(sourceSets.main.output.classesDirs)
    boundaryName.set('Fabric 26.3')
    forbiddenInternalNamePrefixes.set(forbiddenFabricPlatformInternalNames)
    dependsOn tasks.named('classes')
}

repositories {
    mavenCentral()
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.moulberry'
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc26_3_minecraft_version}"
    // Minecraft 26.x ships unobfuscated, so there are no mappings and nothing is remapped.
    implementation "net.fabricmc:fabric-loader:${mc26_3_fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mc26_3_fabric_api_version}"
    // Axiom is optional at runtime and supplies these classes itself when installed.
    compileOnly("com.github.moulberry:AxiomClientAPI:${mc26_3_axiom_api_version}") {
        transitive = false
    }

    implementation(project(':core')) {
        transitive = false
    }
    implementation(project(':platforms:mc26_3:common')) {
        transitive = false
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.jcraft:jorbis:0.0.17'

    embeddedCodecs 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    embeddedCodecs 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    embeddedCodecs 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    embeddedCodecs 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    embeddedCodecs 'org.jflac:jflac-codec:1.5.2'
}

def embeddedCodecsDir = layout.buildDirectory.dir('generated/embeddedCodecs')
def syncEmbeddedCodecs = tasks.register('syncEmbeddedCodecs', Sync) {
    into embeddedCodecsDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        configurations.embeddedCodecs.collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/**/module-info.class'
    }
}

sourceSets.main.output.dir([builtBy: syncEmbeddedCodecs], embeddedCodecsDir)

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mc26_3_minecraft_version: mc26_3_minecraft_version,
            mc26_3_fabric_loader_version: mc26_3_fabric_loader_version,
            mc26_3_fabric_api_version: mc26_3_fabric_api_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    dependsOn ':core:classes', ':platforms:mc26_3:common:classes'
    from coreMainOutput
    from commonMainOutput

    manifest {
        attributes([
                'Specification-Title'       : mod_id,
                'Specification-Vendor'      : mod_authors,
                'Specification-Version'     : '1',
                'Implementation-Title'      : rootProject.name,
                'Implementation-Version'    : archiveVersion,
                'Implementation-Vendor'     : mod_authors
        ])
    }
}

tasks.named('check') {
    dependsOn verifySourceBoundaries, verifyClassBoundaries
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    inputs.files(dedicatedServerProductionRoots)
            .withPropertyName('dedicatedServerProductionClassRoots')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    dependsOn compileCoreMainJava25
    dependsOn ':platforms:mc26_3:common:classes'
    dependsOn tasks.named('classes')

    def productionRootsArgumentProvider = objects.newInstance(
            ProductionRootsJvmArgumentProvider
    )
    productionRootsArgumentProvider.propertyName.set(
            'areamusic.fabric.dedicatedServerProductionRoots'
    )
    productionRootsArgumentProvider.productionRoots.from(
            dedicatedServerProductionRoots
    )
    jvmArgumentProviders.add(productionRootsArgumentProvider)
}
