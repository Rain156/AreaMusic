pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'areamusic'

include ':core'
include ':platforms:mc1_20_1:forge'

project(':platforms').projectDir = file('platforms')
project(':platforms:mc1_20_1').projectDir = file('platforms/1.20.1')
project(':platforms:mc1_20_1:forge').projectDir = file('platforms/1.20.1/forge')
